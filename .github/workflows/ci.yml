name: VoiceBridge AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx rapidfuzz openai python-dotenv fastapi uvicorn websockets numpy
      - name: Run headless unit tests
        run: pytest -v -k "not overlay and not capture"
